<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请在浏览器中打开</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            font-size: 16px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>请在浏览器中打开</h1>
        <p>检测到您正在使用微信访问，微信内置浏览器可能无法正常加载页面。</p>
        <p>请点击下方按钮，在手机浏览器中打开此网站。</p>
        <a href="https://chinahacker.us.kg" class="btn">在浏览器中打开</a>
        <p>如果无法跳转，请手动复制以下链接到浏览器：</p>
        <p><strong>https://chinahacker.us.kg</strong></p>
    </div>

    <script>
        // 检测是否在微信中打开
        var isWeChat = /MicroMessenger/i.test(navigator.userAgent);
        if (isWeChat) {
            // 如果在微信中打开，显示提示信息
            document.body.innerHTML = `
                <div class="container">
                    <h1>请在浏览器中打开</h1>
                    <p>检测到您正在使用微信访问，微信内置浏览器可能无法正常加载页面。</p>
                    <p>请点击下方按钮，在手机浏览器中打开此网站。</p>
                    <a href="https://chinahacker.us.kg" class="btn">在浏览器中打开</a>
                    <p>如果无法跳转，请手动复制以下链接到浏览器：</p>
                    <p><strong>https://chinahacker.us.kg</strong></p>
                </div>
            `;
        } else {
            // 如果不在微信中打开，正常显示网站内容
            document.body.innerHTML = `
                <div class="container">
                    <h1>欢迎访问 chinahacker.us.kg</h1>
                    <p>这是您的网站主页内容。</p>
                    <p>请随意浏览！</p>
                </div>
            `;
        }
    </script>
</body>
</html>
